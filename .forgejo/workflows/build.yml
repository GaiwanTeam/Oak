name: Build And Publish OCI Container

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: node-20-bookworm
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: install podman
        run: |
          apt-get update && apt-get install podman -y

      - name: Log in to the Container registry
        run: |
          echo "${{ secrets.CONTAINER_REGISTRY_TOKEN }}" | podman login -u "arne" --password-stdin ${{ github.server_url }}

      - name: Build and push
        run: |
          IMAGE_BASE="git.gaiwan.co/gaiwan/oak"
          
          # Determine which tags to use based on the Git Reference. We check if
          # the ref starts with "refs/tags/v" followed by a digit.
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9].* ]]; then
            echo "Version Tag Detected ($GITHUB_REF_NAME)"
            TAG_PRIMARY="$IMAGE_BASE:$GITHUB_REF_NAME"
            
            # Check if the tag name contains a hyphen
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
               # Extract everything after the first hyphen
               # e.g., v0.1.2-beta -> beta
               # e.g., v0.1.2-rc -> rc
               SUFFIX=${GITHUB_REF_NAME#*-}
               TAG_SECONDARY="$IMAGE_BASE:$SUFFIX"
            else
               # No hyphen found (e.g., v0.1.2), so it is a stable release
               TAG_SECONDARY="$IMAGE_BASE:latest"
            fi           
            
          else
            echo "Detected Non-release Commit"
            # Use the short SHA and "snapshot"
            SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
            TAG_PRIMARY="$IMAGE_BASE:$SHORT_SHA"
            TAG_SECONDARY="$IMAGE_BASE:snapshot"
          fi

          echo "Primary Tag: $TAG_PRIMARY"
          echo "Secondary Tag: $TAG_SECONDARY"

          podman build -t $TAG_PRIMARY -t $TAG_SECONDARY .
          podman push $TAG_PRIMARY
          podman push $TAG_SECONDARY

