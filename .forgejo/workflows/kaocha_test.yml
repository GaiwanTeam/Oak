name: Kaocha Test Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run_kaocha:
    runs-on: node-20-bookworm
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Configure and install postgres
        run: |
         apt update
         apt install -y postgresql
         service postgresql start
         echo "ALTER USER postgres WITH PASSWORD 'oak';" | su - postgres -c "psql -U postgres -d postgres"

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install Clojure Tools Manually
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          ./linux-install.sh
          # handling the path variables
          BIN_PATH="/usr/local/bin"
          echo "$BIN_PATH" >> $GITHUB_PATH
          # verify
          $BIN_PATH/clojure -version
          echo "Clojure CLI Tools installation completed."

      - name: run Kaocha
        run: ./bin/kaocha

      - name: finish it
        run: echo "Kaocha workflow execution finished."
